<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flexbox and Grid Example</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Flexbox and Grid Layout</h1>

    <!-- FLEXBOX -->
    <section>
        <h2>Flexbox Layout</h2>

        <div class="flex-container">
            <div class="flex-item">HTML</div>
            <div class="flex-item">CSS</div>
            <div class="flex-item">JavaScript</div>
            <div class="flex-item">Python</div>
        </div>
    </section>

    <!-- GRID -->
    <section>
        <h2>Grid Layout</h2>

        <div class="grid-container">
            <div class="grid-item">Home</div>
            <div class="grid-item">About</div>
            <div class="grid-item">Skills</div>
            <div class="grid-item">Projects</div>
            <div class="grid-item">Services</div>
            <div class="grid-item">Contact</div>
        </div>
    </section>

</body>
</html>
